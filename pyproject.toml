[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trustcomponent"
dynamic = ["version"]
description = "Official TrustComponent SDK for Python: TrustCaptcha, TrustAnalytics, TrustMonitoring, Trust VAT Checker and the platform API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Trustcaptcha GmbH", email = "mail@trustcomponent.com" }]
dependencies = [
  "urllib3>=2.2,<3",
  "python-dateutil>=2.8.2",
  "pydantic>=2.11,<3",
  "typing-extensions>=4.7.1",
]

[project.urls]
Homepage = "https://docs.trustcomponent.com"
Source = "https://github.com/trustcomponent/trustcomponent-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.version]
path = "src/trustcomponent/_generated/modules.py"
pattern = "SDK_VERSION = '(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
packages = ["src/trustcomponent"]
# The generated code is git-ignored here; artifacts keeps it in the wheel and the sdist anyway.
artifacts = ["src/trustcomponent/_generated/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/trustcomponent/_generated/**"]
